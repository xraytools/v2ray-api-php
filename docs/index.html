<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>V2Ray API — Documentation</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="PHP API wrapper documentation for x-ui and 3x-ui panels, with configuration and usage examples."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.css"
    />
    <link rel="stylesheet" href="./app.css?version=4" />
    <link rel="shortcut icon" href="./_media/v2ray.png" type="image/x-icon" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "V2Ray API",
        repo: "https://github.com/xraytools/v2ray-api-php",
        homepage: "index.md",
        coverpage: true,
        loadNavbar: true,
        themeColor: "#58a6ff",
        auto2top: true,
        maxLevel: 3,
        subMaxLevel: 3,
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-php.min.js"></script>
  </body>
</html>
